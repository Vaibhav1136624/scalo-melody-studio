<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0e0f12"><title>Scalo · Melody studio</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"></head><body><script src="launch.js"></script>
<header><div class="brand"><b class="logo">∿</b>Scalo</div><span class="studio">Melody studio</span><label class="open">＋ &nbsp; Open song<input id="file" type="file" accept="audio/*"></label></header>
<main><div class="heading"><div><small>NOW LOADED</small><h1 id="title">Daybreak</h1><p id="detail">Original instrumental · Scalo demo</p></div><button id="demo" hidden>Load demo</button></div>
<div class="micbar"><button id="mic" aria-pressed="false">Use microphone</button><span id="micinfo" role="status">Sing to check your note and scale.</span></div><div class="workspace"><section class="chart"><div class="sectionhead"><h2>Pitch trace</h2><span class="legend">● &nbsp;Melody</span></div><canvas id="plot" aria-label="Melodic pitch plotted against swaras over time"></canvas><div class="transport"><button id="play" aria-label="Play">▶</button><div class="timeline"><div class="times"><span id="state" role="status">Preparing audio</span><span id="time">0:00 / 0:00</span></div><input type="range" id="seek" aria-label="Playback position" min="0" max="1000" value="0"></div></div></section>
<aside><section><small>SCALE FINDER</small><h2 id="key">Analyzing…</h2><p>Estimated musical key</p><hr><label for="root">Reference tonic <b>Sa</b></label><select id="root"><option value="-1">Automatic</option></select></section><section class="current"><small>CURRENT SWARA</small><div id="swara">—</div><span id="note">—</span></section></aside></div>
<section class="phrase"><div class="sectionhead"><h2>Swara sequence</h2><span id="count"></span></div><div id="sequence"></div></section>
<footer>Scalo <span>Audio is analyzed on your device.</span></footer></main><audio id="audio" preload="auto"></audio><script src="demo.js"></script><script src="app.js"></script><script>if(location.protocol==='https:' && location.hostname!=='scalo.local' && 'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
